# base/kustomization.yaml – CRDs vorher separat: kubectl create -k bootstrap/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - namespace.yml
  - operator/
  - prometheus/
  - alertmanager/
  - blackbox/
images:
  - name: prom/prometheus
    newTag: v3.5.0  # Version pinnen statt latest
  - name: prom/alertmanager
    newTag: v0.28.1
