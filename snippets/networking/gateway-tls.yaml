---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gateway
  namespace: default
  annotations:
    cert-manager.io/issuer: ca-issuer  # cert-manager erzeugt die Zertifikate
spec:
  gatewayClassName: cilium
  listeners:
    - name: https-grafana
      protocol: HTTPS
      port: 443
      hostname: "grafana.example.local"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: grafana-tls
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: All
