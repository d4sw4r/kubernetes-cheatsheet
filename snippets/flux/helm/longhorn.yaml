---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: kube-system
spec:
  interval: 1h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  install:
    createNamespace: true
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: kube-system
      interval: 10m
  values:
    defaultSettings:
      defaultReplicaCount: 1  # Single-Node
    persistence:
      reclaimPolicy: Retain
      defaultClassReplicaCount: 1
