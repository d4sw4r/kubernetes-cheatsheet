# Cilium auf Talos: kube-proxy-Ersatz, Gateway API, L2-Announcements
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: cilium
      version: 1.18.6
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 10m
  values:
    ipam:
      mode: kubernetes
    hostFirewall:
      enabled: true
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
    kubeProxyReplacement: true
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    cgroup:
      autoMount:
        enabled: false  # Talos mountet cgroups selbst
      hostRoot: /sys/fs/cgroup
    externalIPs:
      enabled: true
    l2announcements:
      enabled: true
    operator:
      replicas: 1
    k8sServiceHost: "localhost"
    k8sServicePort: "6443"
    gatewayAPI:
      enabled: true
      enableAlpn: true
      enableAppProtocol: true
    hostNetwork:
      enabled: true
    envoy:
      securityContext:
        capabilities:
          keepCapNetBindService: true
