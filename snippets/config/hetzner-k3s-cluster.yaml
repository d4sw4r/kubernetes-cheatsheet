# Config für https://github.com/vitobotta/hetzner-k3s
# hetzner-k3s create --config hetzner-k3s-cluster.yaml
hetzner_token: <token>  # besser per Env-Variable HCLOUD_TOKEN
cluster_name: test-cluster
kubeconfig_path: "./kubeconfig"
k3s_version: v1.26.4+k3s1
public_ssh_key_path: "~/.ssh/id_rsa.pub"
private_ssh_key_path: "~/.ssh/id_rsa"
use_ssh_agent: false
ssh_allowed_networks:
  - 0.0.0.0/0  # eigene IP eintragen!
api_allowed_networks:
  - 0.0.0.0/0  # eigene IP eintragen!
private_network_subnet: 10.0.0.0/16
disable_flannel: false
schedule_workloads_on_masters: false
masters_pool:
  instance_type: cpx11
  instance_count: 1
  location: nbg1
worker_node_pools:
  - name: small-static
    instance_type: cx21
    instance_count: 2
    location: hel1
